    <style>
        body{
            background-color: #000;
        }
        body::before{
        content:"";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: url('bg.png');
        background-size: cover;
        background-repeat: repeat;
        animation: blink 5s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
